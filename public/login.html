<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES2 Built | Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-badge">ES2</div>
      <div class="login-brand-sub">Tech Daily Reports</div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">Enter your credentials to access your reports.</p>

      <form id="login-form" class="form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" />
        </div>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>
    </div>

    <p class="login-footer">
      &copy; <span id="year"></span> ES2 Built &mdash; Internal Use Only
    </p>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('login-btn');

      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; errEl.hidden = false; return; }
        window.location.href = '/';
      } catch {
        errEl.textContent = 'Could not connect to server. Please try again.';
        errEl.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
